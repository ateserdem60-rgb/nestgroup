<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nest Group • Admin Giriş</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="eyebrow">Nest Group</div>
    <h1>Yönetim Paneli</h1>
    <p class="muted">Supabase Auth ile giriş yapın.</p>
    <div id="message"></div>
    <form id="login-form">
      <div class="form-field">
        <label>E-posta</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <div class="form-field">
        <label>Şifre</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn dark" style="width:100%" type="submit">Giriş Yap</button>
    </form>
  </div>

  <script type="module">
    import { supabase } from "./supabase.js";

    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = "./admin.html";

    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const box = document.getElementById("message");
      box.innerHTML = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        box.innerHTML = `<div class="error">${error.message}</div>`;
        return;
      }

      window.location.href = "./admin.html";
    });
  </script>
</body>
</html>
