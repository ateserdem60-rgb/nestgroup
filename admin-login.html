<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nest Group • Yönetim Girişi</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="eyebrow">Nest Group</div>
    <h1>Yönetim Girişi</h1>
    <p class="muted">4 haneli yönetim PIN'inizi girin.</p>
    <div id="message"></div>
    <form id="pin-form">
      <div class="form-field">
        <label>Yönetim PIN'i</label>
        <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"
               autocomplete="one-time-code" placeholder="••••" required
               style="font-size:28px;letter-spacing:.45em;text-align:center">
      </div>
      <button class="btn dark" style="width:100%" type="submit">Giriş Yap</button>
    </form>
    <p class="muted" style="font-size:11px;margin-top:18px">İlk PIN: 4747</p>
  </div>
<script type="module">
import { supabase } from "./supabase.js";

if (sessionStorage.getItem("nest_admin_pin_session") === "1") {
  window.location.href = "./admin.html";
}

document.getElementById("pin-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("message");
  const pin = document.getElementById("pin").value.trim();
  msg.innerHTML = "";

  const { data, error } = await supabase.rpc("verify_admin_pin", { entered_pin: pin });

  if (error) {
    msg.innerHTML = `<div class="error">${error.message}</div>`;
    return;
  }
  if (!data) {
    msg.innerHTML = '<div class="error">PIN hatalı.</div>';
    return;
  }
  sessionStorage.setItem("nest_admin_pin_session", "1");
  window.location.href = "./admin.html";
});
</script>
</body>
</html>
