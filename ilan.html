<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>İlan • Nest Group</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header" style="position:sticky;background:#111">
    <div class="header-inner">
      <a class="brand" href="./index.html"><strong>NEST</strong> GROUP</a>
      <nav class="site-nav"><a href="./index.html">ANA SAYFA</a><a href="./index.html#portfoy">İLANLAR</a></nav>
    </div>
  </header>

  <main class="section light">
    <div class="shell" id="detail"><div class="empty" style="color:#666">İlan yükleniyor…</div></div>
  </main>

  <script type="module">
    import { supabase, formatPrice } from "./supabase.js";

    const id = new URLSearchParams(window.location.search).get("id");
    const root = document.getElementById("detail");

    if (!id) {
      root.innerHTML = '<div class="empty" style="color:#666">İlan bulunamadı.</div>';
    } else {
      const { data: p, error } = await supabase
        .from("properties")
        .select("*")
        .eq("id", id)
        .eq("published", true)
        .single();

      if (error || !p) {
        root.innerHTML = '<div class="empty" style="color:#666">İlan bulunamadı veya yayından kaldırılmış.</div>';
      } else {
        const photo = p.cover_url || "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=85";
        const meta = [p.district,p.city,p.rooms,p.gross_m2 ? p.gross_m2+" m²" : ""].filter(Boolean).join(" • ");
        const whatsapp = encodeURIComponent(`Merhaba, ${p.listing_no || ""} numaralı ${p.title} ilanı hakkında bilgi almak istiyorum.`);
        root.innerHTML = `
          <div class="eyebrow">${p.listing_no || "NEST GROUP"}</div>
          <h1 style="font-size:clamp(44px,6vw,78px);margin:12px 0 10px">${p.title}</h1>
          <p class="muted">${meta}</p>
          <img src="${photo}" alt="" style="width:100%;max-height:650px;object-fit:cover;margin:28px 0">
          <div class="section-head">
            <div>
              <h2 style="font-size:42px">${formatPrice(p.price,p.type)}</h2>
              <p class="muted" style="white-space:pre-line">${p.description || ""}</p>
            </div>
            <div><a class="btn dark" href="https://wa.me/905333240347?text=${whatsapp}">WhatsApp'tan Bilgi Al</a></div>
          </div>`;
      }
    }
  </script>
</body>
</html>
