<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard • Nest Group</title><link rel="stylesheet" href="./style.css"></head>
<body>
<div class="admin-layout">

<aside class="sidebar">
  <a class="brand" href="./index.html"><strong>NEST</strong> GROUP</a>
  <div class="sidebar-nav">
    <a href="./admin.html" data-nav="dashboard">Dashboard</a>
    <a href="./ilanlar.html" data-nav="ilanlar">İlanlar</a>
    <a href="./yeni.html" data-nav="yeni">Yeni İlan Ekle</a>
    <a href="./ayarlar.html" data-nav="ayarlar">Ayarlar / PIN</a>
    <a href="./index.html">Siteyi Gör</a>
    <button id="logout" type="button">Çıkış Yap</button>
  </div>
</aside>

<main class="admin-main">
  <div class="admin-top">
    <div><div class="eyebrow">Yönetim</div><h1>Dashboard</h1></div>
    <a class="btn dark" href="./yeni.html">+ Yeni İlan</a>
  </div>
  <div id="message"></div>
  <div class="admin-stats">
    <div class="admin-stat">Toplam İlan<strong id="total">—</strong></div>
    <div class="admin-stat">Yayında<strong id="published">—</strong></div>
    <div class="admin-stat">Satılık<strong id="sale">—</strong></div>
    <div class="admin-stat">Kiralık<strong id="rent">—</strong></div>
  </div>
  <div class="panel">
    <h2 style="font-size:30px;margin-top:0">Son İlanlar</h2>
    <div id="recent" class="muted">Yükleniyor…</div>
  </div>
</main>
</div>

<script type="module">
import { supabase, requireAdmin, formatPrice } from "./supabase.js";

const session = await requireAdmin();
if (session) {
  document.querySelector('[data-nav="dashboard"]').classList.add("active");
  document.getElementById("logout").onclick = async () => {
    sessionStorage.removeItem("nest_admin_pin_session");
    window.location.href = "./admin-login.html";
  };

  const { data, error } = await supabase.from("properties").select("*").order("created_at", { ascending:false });

  if (error) {
    document.getElementById("message").innerHTML = `<div class="error">${error.message}</div>`;
  } else {
    const rows = data || [];
    document.getElementById("total").textContent = rows.length;
    document.getElementById("published").textContent = rows.filter(x => x.published).length;
    document.getElementById("sale").textContent = rows.filter(x => x.type === "Satılık").length;
    document.getElementById("rent").textContent = rows.filter(x => x.type === "Kiralık").length;
    document.getElementById("recent").innerHTML = rows.slice(0,6).map(x => `<p><strong>${x.title}</strong> — ${formatPrice(x.price,x.type)}</p>`).join("") || "Henüz ilan yok.";
  }
}
</script>
</body>
</html>
