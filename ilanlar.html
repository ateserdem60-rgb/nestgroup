<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yeni İlan • Nest Group</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><div class="admin-layout">
<aside class="sidebar"><a class="brand" href="/"><b>NEST</b> GROUP</a><div class="side-nav"><a href="/admin/">Dashboard</a><a href="/admin/ilanlar.html">İlanlar</a><a class="active" href="/admin/yeni.html">Yeni İlan Ekle</a><a href="/">Siteyi Gör</a><button id="logout">Çıkış Yap</button></div></aside>
<main class="admin-main"><div class="admin-top"><div><div class="eyebrow">Portföy</div><h1>Yeni İlan</h1></div></div>
<div id="msg"></div><form id="form" class="form-card">
<div class="form-grid">
 <div class="field"><label>İlan Başlığı *</label><input id="title" required></div>
 <div class="field"><label>İlan No</label><input id="listing_no" placeholder="NG-1001"></div>
 <div class="field"><label>Tür</label><select id="type"><option>Satılık</option><option>Kiralık</option><option>Özel Portföy</option></select></div>
 <div class="field"><label>Fiyat</label><input id="price" type="number" min="0"></div>
 <div class="field"><label>Şehir</label><input id="city" value="Mardin"></div>
 <div class="field"><label>İlçe</label><input id="district" value="Midyat"></div>
 <div class="field"><label>Mahalle / Bölge</label><input id="neighborhood"></div>
 <div class="field"><label>Oda Sayısı</label><input id="rooms" placeholder="2+1"></div>
 <div class="field"><label>Brüt m²</label><input id="gross_m2" type="number"></div>
 <div class="field"><label>Bulunduğu Kat</label><input id="floor"></div>
 <div class="field"><label>Isıtma</label><input id="heating" placeholder="Kombi"></div>
 <div class="field"><label>Durum</label><select id="status"><option>Aktif</option><option>Satıldı</option><option>Kiralandı</option><option>Pasif</option></select></div>
 <div class="field full"><label>Kapak Görseli URL</label><input id="cover_url" placeholder="https://..."></div>
 <div class="field full"><label>Kapak Fotoğrafı Yükle</label><input id="cover_file" type="file" accept="image/*"></div>
 <div class="field full"><label>Açıklama</label><textarea id="description"></textarea></div>
 <div class="field"><label><input id="featured" type="checkbox" style="width:auto"> Öne Çıkan</label></div>
 <div class="field"><label><input id="published" type="checkbox" style="width:auto" checked> Yayında</label></div>
</div>
<div class="actions"><button class="btn dark" type="submit">İlanı Kaydet</button></div></form>
</main></div>
<script type="module">
import {supabase,requireAdmin} from '/assets/supabase.js';
if(await requireAdmin()){
 document.querySelector('#logout').onclick=async()=>{await supabase.auth.signOut();location.href='/admin/login.html'};
 const f=id=>document.querySelector('#'+id);
 async function upload(file){
  if(!file)return null;
  const ext=file.name.split('.').pop()||'jpg'; const name=`${crypto.randomUUID()}.${ext}`;
  const {error}=await supabase.storage.from('property-images').upload(name,file,{upsert:false});
  if(error)throw error;
  const {data}=supabase.storage.from('property-images').getPublicUrl(name); return data.publicUrl;
 }
 f('form').addEventListener('submit',async e=>{
  e.preventDefault(); const msg=f('msg'); msg.innerHTML='';
  try{
   let cover=f('cover_url').value.trim()||null; const file=f('cover_file').files[0]; if(file)cover=await upload(file);
   const payload={title:f('title').value.trim(),listing_no:f('listing_no').value.trim()||null,type:f('type').value,
    price:f('price').value?Number(f('price').value):null,city:f('city').value.trim(),district:f('district').value.trim(),
    neighborhood:f('neighborhood').value.trim()||null,rooms:f('rooms').value.trim()||null,gross_m2:f('gross_m2').value?Number(f('gross_m2').value):null,
    floor:f('floor').value.trim()||null,heating:f('heating').value.trim()||null,status:f('status').value,cover_url:cover,
    description:f('description').value.trim()||null,featured:f('featured').checked,published:f('published').checked};
   const {error}=await supabase.from('properties').insert(payload); if(error)throw error;
   msg.innerHTML='<div class="success">İlan kaydedildi.</div>'; setTimeout(()=>location.href='/admin/ilanlar.html',500);
  }catch(err){msg.innerHTML='<div class="error">'+err.message+'</div>'}
 });
}
</script></body></html>
