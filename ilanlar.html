<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İlanlar • Nest Group</title><link rel="stylesheet" href="./style.css"></head>
<body>
<div class="admin-layout">

<aside class="sidebar">
  <a class="brand" href="./index.html"><strong>NEST</strong> GROUP</a>
  <div class="sidebar-nav">
    <a href="./admin.html" data-nav="dashboard">Dashboard</a>
    <a href="./ilanlar.html" data-nav="ilanlar">İlanlar</a>
    <a href="./yeni.html" data-nav="yeni">Yeni İlan Ekle</a>
    <a href="./index.html">Siteyi Gör</a>
    <button id="logout" type="button">Çıkış Yap</button>
  </div>
</aside>

<main class="admin-main">
  <div class="admin-top">
    <div><div class="eyebrow">Portföy Yönetimi</div><h1>İlanlar</h1></div>
    <a class="btn dark" href="./yeni.html">+ Yeni İlan</a>
  </div>
  <div id="message"></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>İlan No</th><th>Başlık</th><th>Tür</th><th>Fiyat</th><th>Yayın</th><th>İşlem</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
</div>

<script type="module">
import { supabase, requireAdmin, formatPrice } from "./supabase.js";

const session = await requireAdmin();
if (session) {
  document.querySelector('[data-nav="ilanlar"]').classList.add("active");
  document.getElementById("logout").onclick = async () => {
    await supabase.auth.signOut();
    window.location.href = "./admin-login.html";
  };

  async function load() {
    const { data, error } = await supabase.from("properties").select("*").order("created_at", {ascending:false});
    if (error) {
      document.getElementById("message").innerHTML = `<div class="error">${error.message}</div>`;
      return;
    }

    document.getElementById("rows").innerHTML = (data || []).map(p => `
      <tr>
        <td>${p.listing_no || "-"}</td>
        <td>${p.title}</td>
        <td>${p.type || "-"}</td>
        <td>${formatPrice(p.price,p.type)}</td>
        <td><span class="badge ${p.published ? "live" : "off"}">${p.published ? "Yayında" : "Pasif"}</span></td>
        <td>
          <a class="btn small" href="./duzenle.html?id=${encodeURIComponent(p.id)}">Düzenle</a>
          <button class="btn small danger delete" data-id="${p.id}" type="button">Sil</button>
        </td>
      </tr>`).join("");

    document.querySelectorAll(".delete").forEach(button => {
      button.onclick = async () => {
        if (!confirm("Bu ilan kalıcı olarak silinsin mi?")) return;
        const { error } = await supabase.from("properties").delete().eq("id", button.dataset.id);
        if (error) alert(error.message);
        else load();
      };
    });
  }

  load();
}
</script>
</body>
</html>
