<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>İlanlar • Nest Group</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><div class="admin-layout">
<aside class="sidebar"><a class="brand" href="/"><b>NEST</b> GROUP</a><div class="side-nav"><a href="/admin/">Dashboard</a><a class="active" href="/admin/ilanlar.html">İlanlar</a><a href="/admin/yeni.html">Yeni İlan Ekle</a><a href="/">Siteyi Gör</a><button id="logout">Çıkış Yap</button></div></aside>
<main class="admin-main">
<div class="admin-top"><div><div class="eyebrow">Portföy Yönetimi</div><h1>İlanlar</h1></div><a class="btn dark" href="/admin/yeni.html">+ Yeni İlan</a></div>
<div id="msg"></div><div class="table-wrap"><table><thead><tr><th>İlan No</th><th>Başlık</th><th>Tür</th><th>Fiyat</th><th>Durum</th><th>İşlem</th></tr></thead><tbody id="rows"></tbody></table></div>
</main></div>
<script type="module">
import {supabase,requireAdmin,money} from '/assets/supabase.js';
if(await requireAdmin()){
 document.querySelector('#logout').onclick=async()=>{await supabase.auth.signOut();location.href='/admin/login.html'};
 async function load(){
  const {data,error}=await supabase.from('properties').select('*').order('created_at',{ascending:false});
  if(error){document.querySelector('#msg').innerHTML='<div class="error">'+error.message+'</div>';return}
  document.querySelector('#rows').innerHTML=(data||[]).map(p=>`<tr>
   <td>${p.listing_no||'-'}</td><td>${p.title}</td><td>${p.type||'-'}</td><td>${money(p.price,p.type==='Kiralık')}</td>
   <td><span class="badge ${p.published?'active':'passive'}">${p.published?'Yayında':'Pasif'}</span></td>
   <td><a class="btn" href="/admin/duzenle.html?id=${p.id}">Düzenle</a> <button class="btn danger del" data-id="${p.id}">Sil</button></td></tr>`).join('');
  document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{
   if(!confirm('Bu ilan silinsin mi?'))return;
   const {error}=await supabase.from('properties').delete().eq('id',b.dataset.id);
   if(error) alert(error.message); else load();
  });
 }
 load();
}
</script></body></html>
